[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "codex-backend-sdk>=0.5.5",
    "fastapi",
    "b4pt0r-the-framework>=0.2.1,<0.3",
    "httpx",
    "modict>=0.4.19",
    "pillow",
    "playwright",
    "pyyaml",
    "python-multipart",
    "pystray",
    "tiktoken",
    "uvicorn",
    "websockets",
]

[project.optional-dependencies]
dev = ["httpx", "httpx2>=2.0.0", "openai>=3.16.1", "pytest"]

[tool.uv.sources]
b4pt0r-the-framework = { path = "../the_framework", editable = true }
codex-backend-sdk = { path = "../codex-backend-sdk", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["the_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
